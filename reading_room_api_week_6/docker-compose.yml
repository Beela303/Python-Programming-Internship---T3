services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reading_room
      POSTGRES_USER: reading_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reading_user -d reading_room"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://reading_user:local_dev_password@db:5432/reading_room
      SECRET_KEY: local-compose-only-change-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
