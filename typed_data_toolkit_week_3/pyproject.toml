[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typed-data-toolkit"
version = "1.0.0"
description = "A typed, testable CSV/JSON data validation and transformation pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Data Toolkit Project"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
data-toolkit = "data_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
